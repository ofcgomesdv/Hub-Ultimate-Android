name: Gerar APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: HubUltimateMobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: HubUltimateMobile

      - name: Montar chave de assinatura (vem dos Secrets, nunca do repositório)
        env:
          HUB_KEYSTORE_BASE64: ${{ secrets.HUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HUB_KEYSTORE_BASE64" ]; then
            echo "::error::Cadastre os Secrets HUB_KEYSTORE_BASE64, HUB_KEYSTORE_PASSWORD, HUB_KEY_ALIAS e HUB_KEY_PASSWORD"
            exit 1
          fi
          echo "$HUB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hub-release.keystore"
          echo "HUB_KEYSTORE_PATH=$RUNNER_TEMP/hub-release.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK oficial (ofuscado e assinado)
        env:
          HUB_KEYSTORE_PASSWORD: ${{ secrets.HUB_KEYSTORE_PASSWORD }}
          HUB_KEY_ALIAS: ${{ secrets.HUB_KEY_ALIAS }}
          HUB_KEY_PASSWORD: ${{ secrets.HUB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/hub-release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: HubUltimate-apk
          path: HubUltimateMobile/app/build/outputs/apk/release/*.apk
